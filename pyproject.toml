[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitiq"
version = "0.5.0"
description = "Boston transit reliability platform built on MBTA data"
requires-python = ">=3.12"
dependencies = [
  "pyarrow==21.0.0",  # Parquet row counts during ingestion; silver/gold work in later phases
  "boto3==1.43.100",  # S3 bronze store (also preinstalled in the Lambda runtime)
  "duckdb==1.5.6",  # silver validation SQL
  "pyiceberg[sql-sqlite,pyarrow]==0.12.0",  # Iceberg tables with a SQLite catalog
  "tzdata==2026.5",  # IANA time zones; Windows Python ships without them (pyarrow needs "UTC")
  "psycopg[binary]==3.3.6",  # publish gold tables to PostgreSQL / Neon
]

[project.scripts]
transitiq-ingest = "transitiq_pipelines.cli:main"
transitiq-silver = "transitiq_pipelines.silver.cli:main"
transitiq-gold = "transitiq_pipelines.gold.cli:main"

[tool.setuptools.packages.find]
where = ["pipelines/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pipelines/airflow/logs", "web", "dbt", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts", "pipelines/src"]
addopts = "-q"
