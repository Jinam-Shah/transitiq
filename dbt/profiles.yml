# No secrets here: the DuckDB file is local. Path is relative to the repo root (/app in Docker).
transitiq:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('TRANSITIQ_DUCKDB', 'data/warehouse/transitiq.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC
        # Leave room for Airflow, Postgres and LocalStack in Docker Desktop's memory.
        memory_limit: "{{ env_var('TRANSITIQ_DUCKDB_MEMORY', '4GB') }}"
        preserve_insertion_order: false
