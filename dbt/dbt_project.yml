name: transitiq
version: "0.4.0"
config-version: 2
profile: transitiq

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "logs"]

models:
  transitiq:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
      +contract:
        enforced: true

seeds:
  transitiq:
    +schema: reference
    holidays:
      +column_types:
        holiday_date: date
        holiday_name: varchar
        holiday_type: varchar

vars:
  # Definitions used across models (documented in docs/DECISIONS.md D-015).
  on_time_tolerance_seconds: 60      # a segment is on time if actual <= scheduled + this
  bunching_headway_ratio: 0.25       # bunch: headway <= 25% of scheduled headway
  long_gap_headway_ratio: 1.5        # gap before a bunch counts as "long" at >= 150% of scheduled
  reliable_headway_ratio: 1.5        # a headway is reliable if <= 150% of scheduled
  local_timezone: "America/New_York"
  rt_max_gap_minutes: 5              # collector gaps longer than this break coverage (D-022)
  ghost_grace_minutes: 2             # a trip is judged only if covered from start-2 to end+2 min
  ran_min_stop_share: 0.8            # "ran" = reached >= 80% of its stops or seen near its end
  ran_end_slack_minutes: 10
  rt_route_types: [2, 3, 4]          # commuter rail, bus, ferry: trip ids match GTFS (D-022)
  max_prediction_age_minutes: 15     # ignore stop predictions older than this
