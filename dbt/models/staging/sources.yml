version: 2

# GENERATED by scripts/gen_dbt_sources.py from the silver contracts. Do not edit by hand.

sources:
  - name: silver
    schema: silver
    description: Validated Iceberg tables exposed as DuckDB views by `transitiq-silver publish`.
    tables:
      - name: subway_events
        description: "One arrival/departure event per trip and stop (MBTA LAMP subway on-time performance), partitioned by service_date."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: service_date
            data_type: date
          - name: route_id
            data_type: varchar
          - name: trunk_route_id
            data_type: varchar
          - name: branch_route_id
            data_type: varchar
          - name: direction_id
            data_type: integer
          - name: direction
            data_type: varchar
          - name: direction_destination
            data_type: varchar
          - name: trip_id
            data_type: varchar
          - name: vehicle_id
            data_type: varchar
          - name: vehicle_label
            data_type: varchar
          - name: stop_id
            data_type: varchar
          - name: parent_station
            data_type: varchar
          - name: stop_sequence
            data_type: integer
          - name: stop_count
            data_type: integer
          - name: move_ts
            data_type: timestamptz
          - name: stop_ts
            data_type: timestamptz
          - name: travel_time_seconds
            data_type: bigint
          - name: dwell_time_seconds
            data_type: bigint
          - name: headway_trunk_seconds
            data_type: bigint
          - name: headway_branch_seconds
            data_type: bigint
          - name: start_time
            data_type: bigint
          - name: scheduled_arrival_time
            data_type: bigint
          - name: scheduled_departure_time
            data_type: bigint
          - name: scheduled_travel_time
            data_type: bigint
          - name: scheduled_headway_trunk
            data_type: bigint
          - name: scheduled_headway_branch
            data_type: bigint
          - name: _source_file
            data_type: varchar
          - name: _source_sha256
            data_type: varchar
          - name: _loaded_at
            data_type: timestamptz
      - name: alerts
        description: "One row per alert version and informed entity (MBTA LAMP alerts history since 2018)."
        columns:
          - name: alert_id
            data_type: bigint
          - name: cause
            data_type: varchar
          - name: cause_detail
            data_type: varchar
          - name: effect
            data_type: varchar
          - name: effect_detail
            data_type: varchar
          - name: severity_level
            data_type: varchar
          - name: severity
            data_type: integer
          - name: alert_lifecycle
            data_type: varchar
          - name: duration_certainty
            data_type: varchar
          - name: header_text
            data_type: varchar
          - name: created_ts
            data_type: timestamptz
          - name: last_modified_ts
            data_type: timestamptz
          - name: closed_ts
