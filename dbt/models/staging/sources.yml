          - name: stop_lon
            data_type: double
          - name: location_type
            data_type: integer
          - name: parent_station
            data_type: varchar
          - name: wheelchair_boarding
            data_type: integer
          - name: municipality
            data_type: varchar
          - name: vehicle_type
            data_type: integer
          - name: feed_version
            data_type: varchar
          - name: _source_file
            data_type: varchar
          - name: _source_sha256
            data_type: varchar
          - name: _loaded_at
            data_type: timestamptz
      - name: gtfs_trips
