          - name: active_end_ts
            data_type: timestamptz
          - name: route_id
            data_type: varchar
          - name: route_type
            data_type: integer
          - name: direction_id
            data_type: integer
          - name: stop_id
            data_type: varchar
          - name: facility_id
            data_type: varchar
          - name: activities
            data_type: varchar
          - name: _source_file
            data_type: varchar
          - name: _source_sha256
            data_type: varchar
          - name: _loaded_at
            data_type: timestamptz
      - name: weather_hourly
        description: "Hourly weather for downtown Boston in UTC (Open-Meteo, CC BY 4.0)."
        columns:
          - name: hour_ts
            data_type: timestamptz
          - name: temperature_2m_c
            data_type: double
          - name: relative_humidity_2m_pct
            data_type: double
          - name: precipitation_mm
            data_type: double
          - name: rain_mm
            data_type: double
          - name: snowfall_cm
            data_type: double
          - name: snow_depth_m
            data_type: double
          - name: weather_code
            data_type: integer
          - name: wind_speed_10m_kmh
            data_type: double
          - name: wind_gusts_10m_kmh
            data_type: double
          - name: _source_file
            data_type: varchar
          - name: _source_sha256
            data_type: varchar
          - name: _loaded_at
            data_type: timestamptz
      - name: facilities
        description: "Elevators and escalators (MBTA V3 API snapshot)."
        columns:
          - name: facility_id
            data_type: varchar
          - name: facility_type
            data_type: varchar
          - name: long_name
            data_type: varchar
          - name: short_name
