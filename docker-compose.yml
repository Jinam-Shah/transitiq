# TransitIQ local stack (Phase 0).
# Everything here runs on YOUR machine in Docker. Nothing here touches real AWS.
name: transitiq

services:
  localstack:
    image: localstack/localstack:2026.3.0
    container_name: transitiq-localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env (free Hobby plan)}
      SERVICES: s3,lambda,events,sqs,iam,logs,sts
      DEBUG: "0"
      # Lambda containers join the compose network so they can reach LocalStack.
      LAMBDA_DOCKER_NETWORK: transitiq_default
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock # Lambda runs in sibling containers
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    container_name: transitiq-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitiq_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-transitiq}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    # Airflow 3.1 + isolated TransitIQ virtualenv (airflow/Dockerfile, D-017)
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: transitiq-airflow:local
    container_name: transitiq-airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-transitiq}:${POSTGRES_PASSWORD:-transitiq_local_only}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      # Local development only: every visitor is admin, so there is no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_ENDPOINT: http://localstack:4566
      # DAG files import transitiq_pipelines.orchestration (stdlib only) from the mounted repo.
      PYTHONPATH: /app/pipelines/src
      AIRFLOW__CORE__DAGS_FOLDER: /app/pipelines/airflow/dags
      TRANSITIQ_PG_URL: postgresql://${POSTGRES_USER:-transitiq}:${POSTGRES_PASSWORD:-transitiq_local_only}@postgres:5432/${POSTGRES_DB:-transitiq}
    env_file:
      - path: .env  # MBTA_API_KEY, NEON_DATABASE_URL (optional)
        required: false
    volumes:
      - .:/app
      # Iceberg tables + DuckDB file live on a Docker volume, not the Windows-shared folder:
      # heavy database IO across that boundary failed in dbt_build (D-020).
      - warehouse:/app/data/warehouse
      - ./pipelines/airflow/logs:/opt/airflow/logs
      - ./pipelines/airflow/plugins:/opt/airflow/plugins
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Tools container (not started by `docker compose up`). Usage:
  #   docker compose run --rm pipelines transitiq-silver build
  #   docker compose run --rm pipelines pytest
  #   docker compose run --rm pipelines dbt build
  pipelines:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    image: transitiq-pipelines:local
    profiles: ["tools"]
    # Same user as Airflow: both write to ./data, and files created by one must be writable
    # by the other (the first Airflow run failed on root-owned warehouse folders; D-017).
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /app
    volumes:
      - .:/app
      - warehouse:/app/data/warehouse  # same volume as Airflow (D-020)
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /tmp  # uid 50000 has no home directory in this image
      TRANSITIQ_PG_URL: postgresql://${POSTGRES_USER:-transitiq}:${POSTGRES_PASSWORD:-transitiq_local_only}@postgres:5432/${POSTGRES_DB:-transitiq}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt

  # Continuous GTFS-Realtime collector (D-021). Start with:
  #   docker compose --profile realtime up -d realtime
  realtime:
    image: transitiq-pipelines:local
    profiles: ["realtime"]
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /app
    command: ["transitiq-realtime", "collect", "--interval", "30"]
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      HOME: /tmp

volumes:
  localstack-data:
  postgres-data:
  warehouse:  # silver Iceberg tables + gold DuckDB file (rebuildable from ./data/bronze)
