name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.1"

jobs:
  lint-and-test:
    name: Lint and unit tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:  # real Postgres for the gold publish tests
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (moto-mocked Lambdas, silver/Iceberg tests on Linux)
        run: pytest

  terraform-validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose config with example env
        run: |
          cp .env.example .env
          # Placeholder so the required-variable check passes; this job never starts containers.
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=placeholder/' .env
          docker compose config --quiet

  pipelines-image:
    name: Docker image - silver tests, dbt build and docs (sample data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env (compose requires LOCALSTACK_AUTH_TOKEN for every service)
        run: |
          cp .env.example .env
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=placeholder/' .env
          # containers run as AIRFLOW_UID; on Linux it must be the checkout owner to write to it
          sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
      - name: Build image
        run: docker compose build pipelines
      - name: Silver tests inside the container (same environment as local runs)
        run: docker compose run --rm pipelines pytest tests/silver -p no:cacheprovider
      - name: Build synthetic sample warehouse (bronze -> silver -> DuckDB views)
        run: docker compose run --rm pipelines transitiq-silver --data-dir data_sample sample
      - name: dbt build (models, contracts, tests) on the sample
        run: >
          docker compose run --rm -e TRANSITIQ_DUCKDB=data_sample/warehouse/transitiq.duckdb
          pipelines dbt build
      - name: Gold results on the sample are the known right answers
        run: >
          docker compose run --rm --entrypoint python pipelines
          scripts/check_sample_gold.py data_sample/warehouse/transitiq.duckdb
      - name: dbt docs (static site)
        run: >
          docker compose run --rm -e TRANSITIQ_DUCKDB=data_sample/warehouse/transitiq.duckdb
          pipelines dbt docs generate --static
      - name: Prepare docs site
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html
      - name: Upload docs for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  airflow-dags:
    name: Airflow image - DAG import check and task virtualenv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env (compose requires LOCALSTACK_AUTH_TOKEN for every service)
        run: |
          cp .env.example .env
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=placeholder/' .env
          sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
      - name: Build Airflow image
        run: docker compose build airflow
      - name: DAGs import without errors
        run: >
          docker compose run --rm --no-deps --entrypoint python airflow -c
          "from airflow.models.dagbag import DagBag;
          b = DagBag(dag_folder='/app/pipelines/airflow/dags', include_examples=False);
          assert not b.import_errors, b.import_errors;
          d = b.dags['transitiq_daily']; assert len(d.tasks) == 11, len(d.tasks);
          print('OK', sorted(b.dags))"
      - name: Task virtualenv has the pipeline dependencies
        run: >
          docker compose run --rm --no-deps --entrypoint /opt/transitiq-venv/bin/python airflow -c
          "import duckdb, pyiceberg, psycopg, pyarrow, dbt.version; print('venv OK')"

  deploy-docs:
    name: Publish dbt docs to GitHub Pages
    needs: pipelines-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  localstack-e2e:
    name: Deploy to LocalStack and run end-to-end check
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate, compose-validate]
    # Secrets are not passed to workflows from forks, so this job skips itself there.
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # Optional: without it the Lambda calls the MBTA API keyless (lower rate limit).
      TF_VAR_mbta_api_key: ${{ secrets.MBTA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for LocalStack token
        id: token
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "LOCALSTACK_AUTH_TOKEN secret not set; skipping LocalStack jobs."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        if: steps.token.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # the wrapper breaks `terraform output -json` parsing
      - name: Start LocalStack and Postgres
        if: steps.token.outputs.present == 'true'
        run: |
          cp .env.example .env
          sed -i "s/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}/" .env
          docker compose up -d --wait localstack postgres
      - name: Smoke test
        if: steps.token.outputs.present == 'true'
        run: python3 scripts/smoke_test.py --skip airflow
      - name: Install Python deps
        if: steps.token.outputs.present == 'true'
        run: pip install -r requirements-dev.txt
      - name: terraform apply (LocalStack)
        if: steps.token.outputs.present == 'true'
        run: |
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform apply -auto-approve -input=false
      - name: End-to-end check
        if: steps.token.outputs.present == 'true'
        run: python3 scripts/e2e_localstack.py
      - name: Container logs on failure
        if: failure() && steps.token.outputs.present == 'true'
        run: docker compose logs --no-color localstack | tail -300
      - name: terraform destroy
        if: always() && steps.token.outputs.present == 'true'
        run: terraform -chdir=infra/terraform destroy -auto-approve -input=false || true
      - name: Stop containers
        if: always() && steps.token.outputs.present == 'true'
        run: docker compose down -v
