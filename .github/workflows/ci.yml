name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose config with example env
        run: |
          cp .env.example .env
          # Placeholder so the required-variable check passes; this job never starts containers.
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=placeholder/' .env
          docker compose config --quiet

  stack-smoke:
    name: Start LocalStack + Postgres and smoke test
    runs-on: ubuntu-latest
    needs: [lint-and-test, compose-validate]
    # Secrets are not passed to workflows from forks, so this job skips itself there.
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for LocalStack token
        id: token
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "LOCALSTACK_AUTH_TOKEN secret not set; skipping stack smoke test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start containers
        if: steps.token.outputs.present == 'true'
        run: |
          cp .env.example .env
          sed -i "s/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}/" .env
          docker compose up -d --wait localstack postgres
      - name: Smoke test
        if: steps.token.outputs.present == 'true'
        run: python3 scripts/smoke_test.py --skip airflow
      - name: Container logs on failure
        if: failure() && steps.token.outputs.present == 'true'
        run: docker compose logs --no-color
      - name: Stop containers
        if: always() && steps.token.outputs.present == 'true'
        run: docker compose down -v
